<div class="card">
  <h2>Cat</h2>
  <div class="cat-container">
    <div class="cat" [ngClass]="action" (animationend)="resetAction()">🐱</div>
  </div>

  <div class="progress">
    <div class="bar" [style.width.%]="progress"></div>
  </div>

  <p>Treats earned: {{ treats }}</p>
  <button (click)="trainPet()">Train!</button>
</div>
